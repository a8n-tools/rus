---

# Create a Forgejo release when a release/* branch is merged to main, by
# calling the reusable workflow in psa-systems/common, which owns the
# changelog format and the release POST.
#
# `runs-on` is set on this caller job: this Forgejo does not expand a
# cross-repo reusable `uses:` unless the label resolves here.
# `secrets: inherit` is required, because the release POST needs FORGEJO_PAT
# (write:repository) and a called workflow receives no secret it is not passed.
name: Create release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  create-release:
    if: >-
      github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/v')
    uses: https://dev.a8n.run/psa-systems/common/.forgejo/workflows/create-release.yml@main
    # Medium: git and two API calls, nothing compiles.
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}
    secrets: inherit
