---
name: Check
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  secrets:
    uses: https://dev.a8n.run/psa-systems/common/.forgejo/workflows/check-secrets.yml@main
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}
    secrets: inherit
    with:
      # Skip the `common` submodule: it carries a documented `self-check.yml`
      # Postgres placeholder URL that Kingfisher flags as POSTGRES.1 and that
      # common's own CI already suppresses via `noseyparker_findings_exclude`.
      # The placeholder is scanned on every change to common itself; re-scanning
      # it from every consumer is noise. Noseyparker's scan runs after
      # `git for-each-ref` drops every non-HEAD ref so the submodule's own
      # history is unreachable from the scan's git-history mode; no companion
      # `noseyparker_findings_exclude` is needed for this placeholder.
      kingfisher_excludes: "common"
      # Noseyparker finding ids for this repo's intentional test fixtures and
      # dev-only credentials. Each id is derived from the rule + matched text,
      # so it suppresses exactly these secret-shapes wherever they appear
      # (including in git history) and leaves every other match live. A real
      # production credential elsewhere in the repo is a different id and
      # still fails the scan (common's PC-64 rule).
      #
      # - `57e9...`, `38c1...`: the `Admin1234!` dev seed password in
      #   `src/setup_admin.rs` (SETUP_DEFAULT_ADMIN) and its integration test.
      # - `4f8e...`: `WrongPass1!` in `src/handlers/auth.rs` login-failure
      #   test cases.
      # - `80a0...`: dev password example in `docs/prompts/chunk-41-integration-testing.md`.
      # - `b4f4...`: password examples in `README.md` and `CLAUDE.md`
      #   test snippets.
      # - `abd0...`: fixed password in `static/tests/signup-email.test.mjs`.
      #
      # The `OIDC_CLIENT_SECRET=a5fa8b74...` in `.env.saas` (finding id
      # `32dbd80...`) is deliberately left live: it is a 64-hex-char value
      # that looks like a real credential, and leaving the scan red on it
      # keeps it visible as a rotate-me marker. Follow-up after rotation is
      # to replace the value, bump the ids above, and add the new id here.
      noseyparker_findings_exclude: "57e9cedb4b10ba082b962e2013e30f73d0bfdcb1,38c10134d1e530ce34e613620738583a3e06f1ce,4f8e09928795e7473c66af3cfcd40e3a97ab2eb8,80a09f38e18046a5df959804d1329e1b8c582d2b,b4f41ea35f7fcd55877280c00bcbeceb7508f1f9,abd0114be9da0223dee49c05e33b3e16e5b6be24"
  check:
    name: fmt + clippy + build + tests
    # Heavy: compiles Rust natively, which needs cc/ld and the OpenSSL headers of the dev image.
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_HEAVY }}
    env:
      # Only the standalone leg reads a JWT secret; the saas leg has none.
      JWT_SECRET: test-secret-at-least-32-chars-ok!
    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
      - name: Start job metrics sampler
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/job-metrics-start@main
      - name: Set build parallelism
        # Exports CARGO_BUILD_JOBS / NEXTEST_TEST_THREADS / CI_JOBS from the runner, with a warned fallback.
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/build-parallelism@main

      - name: Source tree vs src/
        shell: nu {0}
        # Static: no cargo, so a source tree that drifted from src/ fails in
        # seconds rather than after the build (RUS-29). --self-test first, so a
        # parser that stopped matching fails the job instead of passing it.
        run: |
          nu scripts/check-source-tree.nu --self-test
          nu scripts/check-source-tree.nu
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy (standalone)
        run: cargo clippy --all-targets --features standalone -- -D warnings
      - name: Clippy (saas)
        run: cargo clippy --all-targets --no-default-features --features saas -- -D warnings
      - name: Build (standalone)
        run: cargo build --all-targets --features standalone
      - name: Build (saas)
        run: cargo build --all-targets --no-default-features --features saas
      - name: Unit tests (every feature leg)
        shell: nu {0}
        # cargo exits 0 on a run that collected nothing, was fully filtered, or
        # was entirely #[ignore]d, so the legs go through the guard, which reads
        # them from the [[bin]] required-features in Cargo.toml (RUS-23). The
        # same guard fails a `test = false` target whose source carries test
        # code cargo test never runs (RUS-27). --self-test first, so a guard
        # that stopped detecting fails the job instead of passing it vacuously.
        run: |
          nu scripts/check-cargo-tests-ran.nu --self-test
          nu scripts/check-cargo-tests-ran.nu
      - name: Static page tests
        # The dev runner ships nodejs24. The bare `node` is a libalternatives
        # wrapper whose target is not always installed, so prefer `node24` and
        # fail the job when neither resolves rather than skipping the suite.
        shell: nu {0}
        run: |
          let node_bin = (["node24" "node"] | where { |candidate| (which $candidate | is-not-empty) } | get 0?)
          if ($node_bin | is-empty) {
              print "No Node runtime on the runner; the static page tests cannot run."
              exit 1
          }
          ^$node_bin static/tests/run.mjs

      - name: Report job metrics
        if: always()
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/job-metrics-report@main
