---
name: Check
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  check:
    name: fmt + clippy + build + tests
    # Dev label: this job compiles Rust natively, and build scripts need the
    # C toolchain (cc/ld) plus glibc/OpenSSL headers the base image lacks.
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_DEV_LATEST }}
    env:
      # Only the standalone leg reads a JWT secret; the saas leg has none.
      JWT_SECRET: test-secret-at-least-32-chars-ok!
    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
      - name: Cap build parallelism
        # nproc/2 cap: never claim more than half the host (see CI.md "Concurrency cap").
        run: echo "CARGO_BUILD_JOBS=$(($(nproc) / 2))" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy (standalone)
        run: cargo clippy --all-targets --features standalone -- -D warnings
      - name: Clippy (saas)
        run: cargo clippy --all-targets --no-default-features --features saas -- -D warnings
      - name: Build (standalone)
        run: cargo build --all-targets --features standalone
      - name: Build (saas)
        run: cargo build --all-targets --no-default-features --features saas
      - name: Unit tests (every feature leg)
        shell: nu {0}
        # cargo exits 0 on a run that collected nothing, was fully filtered, or
        # was entirely #[ignore]d, so the legs go through the guard, which reads
        # them from the [[bin]] required-features in Cargo.toml (RUS-23). The
        # same guard fails a `test = false` target whose source carries test
        # code cargo test never runs (RUS-27). --self-test first, so a guard
        # that stopped detecting fails the job instead of passing it vacuously.
        run: |
          nu scripts/check-cargo-tests-ran.nu --self-test
          nu scripts/check-cargo-tests-ran.nu
      - name: Static page tests
        # The dev runner ships nodejs24. The bare `node` is a libalternatives
        # wrapper whose target is not always installed, so prefer `node24` and
        # fail the job when neither resolves rather than skipping the suite.
        shell: nu {0}
        run: |
          let node_bin = (["node24" "node"] | where { |candidate| (which $candidate | is-not-empty) } | get 0?)
          if ($node_bin | is-empty) {
              print "No Node runtime on the runner; the static page tests cannot run."
              exit 1
          }
          ^$node_bin static/tests/run.mjs
