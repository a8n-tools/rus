[package]
name = "rus"
version = "0.15.1"
edition = "2021"
default-run = "rus"
build = "build.rs"

[lib]
name = "rus"
path = "src/lib.rs"

# test = false: src/main.rs holds only the HttpServer wiring, so a second test
# harness for it is duplicate work (RUS-24). scripts/check-cargo-tests-ran.nu
# fails a #[cfg(test)] block added here, which would otherwise never run (RUS-27).
[[bin]]
name = "rus"
path = "src/main.rs"
required-features = ["standalone"]
test = false

[[bin]]
name = "rus-saas"
path = "src/main.rs"
required-features = ["saas"]
test = false

[features]
default = ["standalone"]
standalone = ["dep:bcrypt", "dep:argon2", "dep:actix-web-httpauth"]
saas = [
    "dep:hmac",
    "dep:hex",
    "dep:uuid",
    "dep:reqwest",
    "dep:urlencoding",
    "dep:moka",
]

[dependencies]
actix-web = "4.4"
actix-governor = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full", "time", "sync"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
bcrypt = { version = "0.15", optional = true }
argon2 = { version = "0.5", optional = true }
jsonwebtoken = "9.2"
chrono = { version = "0.4", features = ["serde"] }
actix-web-httpauth = { version = "0.8", optional = true }
dotenvy = "0.15"
qrcode = "0.14"
image = "0.25"
base64 = "0.22"
url = "2.5"
# Trusted-proxy CIDR matching for the forwarded IP / country gate (RUS-12).
ipnetwork = "0.20"
hmac = { version = "0.12", optional = true }
# Approval-token hashing (RUS-19) runs in both legs, so this is not optional.
sha2 = "0.10"
hex = { version = "0.4", optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false, optional = true }
urlencoding = { version = "2", optional = true }
moka = { version = "0.12", features = ["future"], optional = true }
# Security alert email (RUS-7). rustls, not native-tls: it is pure Rust, so the
# TLS transport (RUS-16) builds without openssl in the musl builder image.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-actix-web = "0.7"

[dev-dependencies]
actix-http = "3"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
